[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "akha-scanner"
version = "1.0.0"
description = "AKHA-XSS Detection Framework"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "AKHA Security", email = "caneraktas12@gmail.com" },
]
license = { text = "MIT" }
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "requests>=2.31.0",
  "httpx>=0.24.0",
  "urllib3>=2.0.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=4.9.0",
  "html5lib>=1.1",
  "click>=8.1.0",
  "rich>=13.0.0",
  "colorama>=0.4.6",
  "jinja2>=3.1.0",
  "markupsafe>=2.1.0",
  "pyyaml>=6.0.0",
  "pydantic>=2.7.0",
  "python-dateutil>=2.8.0",
  "playwright>=1.40.0",
  "selenium>=4.10.0",
]

[project.urls]
"Homepage" = "https://github.com/akha-security/akha-xss"
"Bug Tracker" = "https://github.com/akha-security/akha-xss/issues"
"Source Code" = "https://github.com/akha-security/akha-xss"

[project.scripts]
akha-xss = "akha.__main__:_entry"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["akha*"]

[tool.setuptools.package-data]
akha = [
  "data/wordlists/*.txt",
  "data/waf_profiles/*.yaml",
]
